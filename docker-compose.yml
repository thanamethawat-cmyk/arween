services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arween
    ports:
      - "5432:5432"
    volumes:
      - arween_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arween"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ทางเลือก: รันแอปในคอนเทนเนอร์ (ปกติพัฒนาด้วย npm run dev ชี้ DB นี้)
  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXTAUTH_URL: http://localhost:8080
        NEXTAUTH_SECRET: local-compose-secret-change-me
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/arween?schema=public
      NEXTAUTH_URL: http://localhost:8080
      NEXTAUTH_SECRET: local-compose-secret-change-me
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  arween_pg:
